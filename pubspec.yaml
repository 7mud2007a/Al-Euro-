name: al_euro_app
description: Al Euro (اليورو) - Luxury Car Spare Parts Sales & Exchange App.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  intl: ^0.20.3
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1
  image_picker: ^1.1.2

flutter:
  uses-material-design: true
  assets:
    - assets/lang/ar.json
    - assets/lang/en.json
    
