name: Build Al Euro APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build_apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Android Project Files
        run: |
          mkdir -p /tmp/backup/lib /tmp/backup/assets
          cp -r lib/* /tmp/backup/lib/
          cp -r assets/* /tmp/backup/assets/ || true
          cp pubspec.yaml /tmp/backup/pubspec.yaml
          flutter create --platforms=android --project-name al_euro_app .
          cp -r /tmp/backup/lib/* lib/
          mkdir -p assets/lang
          cp -r /tmp/backup/assets/* assets/ || true
          cp /tmp/backup/pubspec.yaml pubspec.yaml
          find lib -type f -name "*.dart" -exec sed -i 's/^Import /import /g' {} +
          find lib -type f -name "*.dart" -exec sed -i 's/Icons\.LinearScale/Icons.linear_scale/g' {} +
          find lib -type f -name "*.dart" -exec sed -i 's/Icons\.Build_circle_outlined/Icons.build_circle_outlined/g' {} +

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Al-Euro-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
